<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Shield Outer -->
  <path d="M24 4L7 11V22C7 33.2 14.3 43.1 24 46C33.7 43.1 41 33.2 41 22V11L24 4Z" 
        fill="url(#shield-grad)" stroke="url(#cyber-grad)" stroke-width="2.5" />
  <!-- Circuit Grid Accents -->
  <path d="M24 12V24M24 24L17 31M24 24L31 31" 
        stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <!-- Glowing AI Node -->
  <circle cx="24" cy="24" r="4.5" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="17" cy="31" r="2.5" fill="#4facfe" />
  <circle cx="31" cy="31" r="2.5" fill="#4facfe" />
  <circle cx="24" cy="12" r="2.5" fill="#00f2fe" />
</svg>
